title = "Compte à rebours, sens de la soirée, photos et déroulement"
description = "Ajoute à l'accueil le compte à rebours (jours, heures, minutes, secondes) vers la date et l'heure du dîner lues en base, avec la date limite à côté ; la section « Le sens de cette soirée » ; les cadres photo libellés en attendant les vraies photos ; « Les dîners précédents » ; le déroulement de la soirée ; et l'apparition discrète des sections au défilement, coupée sous « réduire les animations »."
verify = "Le compte à rebours diminue chaque seconde et affiche la date limite ; après le début du dîner, il ne devient jamais négatif ; les cadres photo, le sens de la soirée et le déroulement s'affichent en français et en anglais ; avec « réduire les animations », aucune section ne bouge."
