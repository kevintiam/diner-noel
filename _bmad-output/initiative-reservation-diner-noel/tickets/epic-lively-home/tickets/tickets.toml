title = "L'accueil reprend la structure de la maquette"
description = "Nouvel en-tête des pages publiques (nom du dîner, FR/EN, bouton « Réserver »), bandeau vert (lieu, titre, sous-titre, verset de Luc 2.11, date, heure d'accueil, lieu, « Réserver ma place », prix et places restantes), informations pratiques en 4 cartes, « Comment réserver » en 3 étapes, rappel final avec la barre des places, et pied de page ; tout en français et en anglais, avec les données de la base."
