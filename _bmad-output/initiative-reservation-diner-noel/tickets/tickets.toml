# Épopées de l'initiative, dans l'ordre de construction.
# 2026-11-15 : l'épopée 4 (accueil complet) passe juste après l'épopée 1, avant la mise en ligne.

[[epic]]
id = 1
slug = "epic-reserve-and-pay"
title = "Les participants réservent et paient en ligne"
description = "Sur le site en production, en français ou en anglais, un participant voit l'accueil simple, réserve sans dépasser les places, reçoit son accusé de réception et dépose sa preuve avec son lien personnel."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R22", "R23"]

[[epic]]
id = 4
slug = "epic-lively-home"
title = "L'accueil donne envie de venir"
description = "La page d'accueil reprend toute la maquette 1 : en-tête, bandeau avec verset, compte à rebours, sens de la soirée, informations pratiques, photos, déroulement, « comment réserver » et rappel final, en français et en anglais."
covers = ["R2"]
after = [{ epic = 1, needs = "la page d'accueil simple et bilingue, et le bouton de réservation" }]

[[epic]]
id = 2
slug = "epic-verify-payments"
title = "Les organisateurs vérifient les paiements"
description = "Un organisateur connecté ouvre une réservation, voit ses captures, confirme ou refuse, et le participant reçoit le courriel correspondant dans sa langue."
covers = ["R1", "R11", "R12", "R13", "R14", "R16", "R22", "R23"]
after = [{ epic = 1, needs = "le schéma complet, les réservations, les captures et l'envoi de courriels" }]

[[epic]]
id = 3
slug = "epic-manage-event"
title = "Les organisateurs pilotent l'événement"
description = "Le tableau de bord filtre et cherche les réservations, affiche les compteurs et l'état des comptes, permet d'annuler une réservation et de modifier les paramètres de l'événement."
covers = ["R12", "R15", "R16", "R17", "R18"]
after = [{ epic = 2, needs = "la connexion des organisateurs, la liste et la fiche de réservation" }]

[[epic]]
id = 5
slug = "epic-close-event"
title = "Le dîner se clôture sans travail manuel"
description = "Les organisateurs sont alertés s'il reste des preuves à vérifier, les réservations non confirmées sont annulées la veille, et la liste des confirmés s'exporte en CSV."
covers = ["R16", "R19", "R20", "R21"]
after = [{ epic = 2, needs = "les comptes des organisateurs, les changements de statut et l'envoi de courriels" }, { epic = 3, needs = "le tableau de bord avec ses compteurs (le bandeau d'alerte s'y ajoute) et l'annulation" }]
